name: Deploy

# Push to main = live site. Build the image, push to GHCR, then
# SSH into the Oracle Cloud VM and pull + restart.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ORACLE_HOST     — public IPv4 of the Oracle VM  (e.g. 123.45.67.89)
#   ORACLE_USER     — SSH user                     (usually "ubuntu")
#   ORACLE_SSH_KEY  — private key matching the VM's authorized_keys
#   GHCR_PAT        — classic PAT with read:packages (used on the VM
#                     so it can pull the private image from GHCR)
# See docs/DEPLOYMENT.md for the full walkthrough.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/seanneol88/my-portfolio

jobs:
  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Oracle free tier VMs are amd64 (E2.1.Micro).
      # If you pick an ARM VM (VM.Standard.A1.Flex), add:
      #   platforms: linux/arm64
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~/portfolio
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose --profile edge up -d
            docker image prune -f
