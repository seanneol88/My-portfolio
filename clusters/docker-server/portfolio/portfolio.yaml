apiVersion: v1
kind: Namespace
metadata: {name: portfolio}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: portfolio, namespace: portfolio}
spec:
  replicas: 1
  selector: {matchLabels: {app: portfolio}}
  template:
    metadata: {labels: {app: portfolio}}
    spec:
      containers:
        - name: portfolio
          image: portfolio:v2
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          resources:
            requests: {memory: "64Mi", cpu: "25m"}
            limits:   {memory: "128Mi", cpu: "200m"}
          readinessProbe: {httpGet: {path: /, port: 3000}}
---
apiVersion: v1
kind: Service
metadata: {name: portfolio, namespace: portfolio}
spec:
  selector: {app: portfolio}
  ports: [{port: 80, targetPort: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: portfolio
  annotations: {kubernetes.io/ingress.class: traefik}
spec:
  ingressClassName: traefik
  rules:
    - host: portfolio.seanneol.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: portfolio, port: {number: 80}}}}
